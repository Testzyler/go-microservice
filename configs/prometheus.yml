global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8081"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
