global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ["auth:8081"]

  - job_name: auth-worker-mailer
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-worker:9100"]

  - job_name: auth-worker-auditor
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-worker-auditor:9100"]

  - job_name: auth-worker-cleanup
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-worker-cleanup:9100"]

  - job_name: auth-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-scheduler:9003"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
