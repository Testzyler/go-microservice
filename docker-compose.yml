x-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build: *app-build
    command: ["serve-auth"]
    env_file:
      - .env.docker
    environment:
      AUTH_HTTP_PORT: 8081
      AUTH_DATABASE_URL: postgres://postgres:postgres@postgres:5432/auth?sslmode=disable
      LOG_ENCODING: console
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"

  auth-worker:
    build: *app-build
    command: ["serve-auth-worker", "mailer"]
    env_file:
      - .env.docker
    environment:
      LOG_ENCODING: console
    depends_on:
      auth:
        condition: service_started
      redis:
        condition: service_healthy

  auth-worker-auditor:
    build: *app-build
    command: ["serve-auth-worker", "auditor"]
    env_file:
      - .env.docker
    environment:
      LOG_ENCODING: console
    depends_on:
      auth:
        condition: service_started
      redis:
        condition: service_healthy

  auth-worker-cleanup:
    build: *app-build
    command: ["serve-auth-worker", "cleanup"]
    env_file:
      - .env.docker
    environment:
      LOG_ENCODING: console
    depends_on:
      auth:
        condition: service_started
      redis:
        condition: service_healthy

  auth-scheduler:
    build: *app-build
    command: ["serve-auth-scheduler"]
    env_file:
      - .env.docker
    environment:
      LOG_ENCODING: console
    depends_on:
      auth:
        condition: service_started
      redis:
        condition: service_healthy

  internal-gateway:
    build: *app-build
    command: ["serve-internal-gateway"]
    env_file:
      - .env.docker
    environment:
      GATEWAY_SERVICE_NAME: internal-gateway
      GATEWAY_PORT: 8080
      AUTH_SERVICE_URL: http://auth:8081
      LOG_ENCODING: console
    depends_on:
      auth:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  asynqmon:
    image: hibiken/asynqmon:0.7.2
    platform: ${ASYNQMON_PLATFORM:-linux/amd64}
    command: ["--redis-addr=redis:6379"]
    ports:
      - "8082:8080"
    depends_on:
      redis:
        condition: service_healthy

  tempo:
    image: grafana/tempo:2.6.1
    user: "0"
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./configs/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      tempo:
        condition: service_started

  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./configs/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.8
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./configs/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./configs/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./configs/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
        
volumes:
  postgres_data:
  grafana_data:
  loki_data:
  tempo_data:
  prometheus_data:
